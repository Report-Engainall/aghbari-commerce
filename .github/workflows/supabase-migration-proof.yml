name: supabase-migration-proof

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git commit SHA to verify'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aghbari-migration-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact target HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "EXACT HEAD MISMATCH: expected=$TARGET_SHA actual=$actual"
            exit 1
          }
          echo "EXACT MIGRATION PROOF HEAD: $actual"
      - name: Fail fast on duplicate migration versions
        shell: bash
        run: |
          versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate migration versions detected:"
            printf '%s\n' "$duplicates"
            exit 1
          fi
          echo "Migration version uniqueness: PASS"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from empty database
        run: supabase db reset --local
      - name: Run database pgTAP proofs
        run: supabase test db --local
      - name: Verify local migration inventory
        run: supabase migration list --local
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
