name: F04 Transfer Targeted Proof
on:
  push:
    branches: [war-room/master-parallel-efb]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact repair lineage
        run: |
          git rev-parse HEAD
          test -f supabase/migrations/20260915150000_fix_transfer_inventory_idempotency_lookup.sql
          test -f supabase/tests/040-transfer-inventory-adversarial.test.sql
      - name: Install Supabase CLI
        run: npm install --global supabase@latest
      - name: Start isolated local database
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector
      - name: Apply migrations from clean database
        run: supabase db reset --local --no-seed
      - name: Run real pgTAP adversarial transfer suite
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          psql "postgresql://postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/040-transfer-inventory-adversarial.test.sql | tee /tmp/f04-transfer.tap
          if ! grep -Eq '^# Looks like you failed 0 tests$' /tmp/f04-transfer.tap; then
            echo 'F04 pgTAP assertion failure: refusing false CI success.'
            exit 1
          fi
      - name: Stop isolated database
        if: always()
        run: supabase stop --no-backup
