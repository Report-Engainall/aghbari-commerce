name: F31 Mutation Proof
on:
  workflow_dispatch:
  push:
    branches: [war-room/master-parallel-efb]
permissions:
  contents: read
jobs:
  mutation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.sha }}
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Exact SHA
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: supabase/setup-cli@v1
        with: {version: 2.117.0}
      - name: Run real eight-boundary mutation proof
        env: {PGPASSWORD: postgres}
        shell: bash
        run: bash war-room/f31/run-mutation-proof.sh /tmp/f31
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f31-mutation-evidence-${{ github.sha }}
          path: /tmp/f31
          if-no-files-found: error
      - if: always()
        run: supabase stop --no-backup
