name: G1 Domain Proof

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: 'Exact Git commit SHA to verify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  g1-domain-invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TARGET_SHA: ${{ inputs.exact_sha || github.event.pull_request.head.sha || github.sha }}
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Validate exact SHA input
        shell: bash
        run: echo "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Verify exact target HEAD
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || {
            echo "EXACT HEAD MISMATCH: expected=$TARGET_SHA actual=$actual"
            exit 1
          }
          echo "EXACT G1 DOMAIN PROOF HEAD: $actual"
      - name: Run deterministic G1 domain proof
        run: node --test poc/transactional-core/invariants.mjs
      - name: Run PostgreSQL transactional G1 proof
        run: bash poc/transactional-core/run-postgres-g1-proof.sh
