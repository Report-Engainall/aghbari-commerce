name: bootstrap-release-lockfile

on:
  push:
    branches:
      - main
      - execution/close-lockfile-20260907
      - security/rpc-surface-final6
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CI: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify package inputs
        run: |
          node --version
          npm --version
          test -f package.json
          npm pkg get name version engines dependencies devDependencies
      - name: Generate lockfile
        id: lockfile
        shell: bash
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund >npm-lockfile.log 2>&1
          status=$?
          cat npm-lockfile.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload lockfile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-lockfile-diagnostics-${{ github.run_id }}
          path: npm-lockfile.log
          if-no-files-found: warn
      - name: Fail if lockfile generation failed
        if: steps.lockfile.outputs.exit_code != '0'
        run: |
          echo "Deterministic lockfile generation failed with exit code ${{ steps.lockfile.outputs.exit_code }}"
          exit 1
      - name: Verify lockfile
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
          node -e "const p=require('./package-lock.json'); if (p.lockfileVersion !== 3) process.exit(1); console.log('lockfileVersion=' + p.lockfileVersion)"
      - name: Commit synchronized lockfile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: add deterministic npm lockfile'
          git push
