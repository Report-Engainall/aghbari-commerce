name: canonical-baseline-materialize
on:
  push:
    branches: [reconstruction/canonical-lineage]
    paths:
      - 'supabase/tools/export_canonical_baseline.sh'
      - 'supabase/tools/emit_canonical_runtime.sql'
      - 'supabase/tools/verify_canonical_baseline.sql'
      - '.github/workflows/canonical-baseline-materialize.yml'
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Materialize canonical chunks
        env:
          DATABASE_URL: ${{ secrets.CANONICAL_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          bash supabase/tools/export_canonical_baseline.sh
          test -s supabase/canonical/01_tables_and_constraints.sql
          test -s supabase/canonical/02_functions_and_triggers.sql
          test -s supabase/canonical/03_rls_and_acls.sql
          test -s supabase/canonical/04_indexes_and_realtime.sql
          test -s supabase/canonical_baseline.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tools/verify_canonical_baseline.sql
      - name: Commit generated chunks
        run: |
          git config user.name 'canonical-baseline-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/canonical supabase/canonical_baseline.sql
          git diff --cached --quiet && exit 0
          git commit -m 'chore(canonical): materialize live baseline chunks'
          git push origin HEAD:reconstruction/canonical-lineage
